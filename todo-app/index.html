<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App - Local Storage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My To-Do List</h1>
            <p class="subtitle">Organize your tasks with ease</p>
        </header>

        <main>
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task... (Press Enter)"
                        aria-label="Add new task"
                    >
                    <button id="addBtn" class="add-btn" aria-label="Add task">
                        <span class="btn-icon">+</span>
                        <span class="btn-text">Add</span>
                    </button>
                </div>
                <div class="input-hint">Press Enter or click Add to create a new task</div>
            </div>

            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stat-item">
                    <span class="stat-label">Total:</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Active:</span>
                    <span class="stat-value" id="activeTasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Completed:</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all" aria-pressed="true">
                    All
                </button>
                <button class="filter-btn" data-filter="active" aria-pressed="false">
                    Active
                </button>
                <button class="filter-btn" data-filter="completed" aria-pressed="false">
                    Completed
                </button>
            </div>

            <!-- Tasks List -->
            <div class="tasks-container">
                <ul id="tasksList" class="tasks-list" role="list">
                    <!-- Tasks will be added here by JavaScript -->
                </ul>
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">📭</div>
                    <p>No tasks yet. Add one to get started!</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="clearCompletedBtn" class="action-btn clear-completed-btn">
                    🗑️ Clear Completed
                </button>
                <button id="clearAllBtn" class="action-btn clear-all-btn">
                    🔥 Clear All Tasks
                </button>
            </div>
        </main>

        <footer>
            <p>💾 Tasks are automatically saved to your browser</p>
            <p class="footer-hint">Your data never leaves your device</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
